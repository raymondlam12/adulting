name: Adulting
options:
  bundleIdPrefix: com.raymondlam
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

targets:
  Adulting:
    type: application
    platform: iOS
    sources:
      - path: Sources/Adulting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raymondlam.adulting
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_PREVIEWS: "YES"
    info:
      path: Sources/Adulting/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: "Adulting uses the camera to capture receipt photos."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
